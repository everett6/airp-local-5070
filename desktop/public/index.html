<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>airp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img class="brand-logo" src="logo.png" alt="">airp<span class="brand-light">paper book</span></div>
    <nav class="side-nav" id="nav">
      <button class="nav-item active" data-view="overview"><span class="nav-icon">◉</span>Overview</button>
      <button class="nav-item" data-view="strategies"><span class="nav-icon">↗</span>Strategies</button>
      <button class="nav-item" data-view="lab"><span class="nav-icon">⚗</span>Strategy lab</button>
      <button class="nav-item" data-view="books"><span class="nav-icon">▤</span>Live book &amp; orders</button>
      <button class="nav-item" data-view="signals"><span class="nav-icon">◆</span>AI signals</button>
      <button class="nav-item" data-view="health"><span class="nav-icon">♥</span>Trading health</button>
      <button class="nav-item" data-view="research"><span class="nav-icon">⟳</span>Research queue</button>
      <button class="nav-item" data-view="tests"><span class="nav-icon">✓</span>Tests</button>
      <button class="nav-item" data-view="reviews"><span class="nav-icon">☰</span>Weekly reviews</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="provider-box" id="mode-box">
        <div class="side-label-inline">TRADING STATE</div>
        <p id="mode-text" class="muted">…</p>
        <button class="btn danger wide" id="halt-btn">Kill switch</button>
      </div>
      <p class="tiny muted">Paper money only · <span id="updated">–</span></p>
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumbs"><span>airp</span><span class="crumb-slash">/</span><strong id="crumb">Overview</strong></div>
      <div class="top-actions"><button class="btn ghost" id="rebuild">Rebuild charts</button><button class="btn ghost" id="refresh">Refresh</button></div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg">
    <h3 id="dlg-title"></h3>
    <p id="dlg-text" class="muted"></p>
    <input id="dlg-reason" placeholder="Reason" autocomplete="off">
    <input id="dlg-confirm" placeholder="Type HALT to confirm" autocomplete="off">
    <p id="dlg-error" class="err"></p>
    <div class="row-end"><button class="btn ghost" value="cancel">Cancel</button><button class="btn danger" id="dlg-ok" value="ok">Confirm</button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
