<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>airp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="airp logo">
        <div class="brand-text">
          <span class="brand-title">airp</span>
          <span class="brand-light">paper book</span>
        </div>
      </div>
      <div class="nav-search-wrap">
        <span class="nav-search-icon">⌕</span>
        <input type="text" id="nav-search" class="nav-search-input" placeholder="Quick find… ( / )" autocomplete="off" spellcheck="false">
        <button type="button" id="nav-search-clear" class="search-clear-btn" hidden title="Clear search">&times;</button>
      </div>
    </div>
    <nav class="side-nav" id="nav">
      <div class="nav-section-title">Overview</div>
      <button class="nav-item active" data-view="overview"><span class="nav-icon">◉</span>Home</button>
      <button class="nav-item" data-view="how"><span class="nav-icon">?</span>How it works</button>

      <div class="nav-section-title">Portfolio &amp; Trading</div>
      <button class="nav-item" data-view="strategies"><span class="nav-icon">↗</span>Strategies</button>
      <button class="nav-item" data-view="risk"><span class="nav-icon">◈</span>Portfolio &amp; risk</button>
      <button class="nav-item" data-view="books"><span class="nav-icon">▤</span>Live book &amp; orders</button>
      <button class="nav-item" data-view="alpaca"><span class="nav-icon">$</span>Alpaca accounts</button>
      <button class="nav-item" data-view="signals"><span class="nav-icon">◆</span>AI picks</button>
      <button class="nav-item" data-view="health"><span class="nav-icon">♥</span>Trading health</button>

      <div class="nav-section-title">Research &amp; Lab</div>
      <button class="nav-item" data-view="lab"><span class="nav-icon">⚗</span>Strategy lab</button>
      <button class="nav-item" data-view="planning"><span class="nav-icon">◇</span>AI planning &amp; cases</button>
      <button class="nav-item" data-view="horizons"><span class="nav-icon">◷</span>Horizon shadows</button>
      <button class="nav-item" data-view="research"><span class="nav-icon">⟳</span>Research queue</button>
      <button class="nav-item" data-view="researchlog"><span class="nav-icon">◎</span>Research log</button>
      <button class="nav-item" data-view="records"><span class="nav-icon">▦</span>Records</button>

      <div class="nav-section-title">Automation &amp; Runs</div>
      <button class="nav-item" data-view="autopilot"><span class="nav-icon">▶</span>Autopilot</button>
      <button class="nav-item" data-view="fund"><span class="nav-icon">⛨</span>Fund control</button>
      <button class="nav-item" data-view="operations"><span class="nav-icon">▶</span>Run Center</button>
      <button class="nav-item" data-view="runs"><span class="nav-icon">⏱</span>Run history</button>
      <button class="nav-item" data-view="improvement"><span class="nav-icon">↻</span>Self-improvement</button>

      <div class="nav-section-title">Audit &amp; Quality</div>
      <button class="nav-item" data-view="tests"><span class="nav-icon">✓</span>Tests</button>
      <button class="nav-item" data-view="reviews"><span class="nav-icon">☰</span>Weekly reviews</button>
      <button class="nav-item" data-view="institutional"><span class="nav-icon">✓</span>Engineering checks</button>
      <button class="nav-item" data-view="benchmark"><span class="nav-icon">≡</span>Source review</button>

      <div class="nav-section-title">System</div>
      <button class="nav-item" data-view="system"><span class="nav-icon">▣</span>System</button>
      <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="provider-box" id="mode-box">
        <div class="mode-header">
          <span class="side-label-inline">TRADING STATE</span>
          <span class="mode-badge" id="mode-badge">PAPER</span>
        </div>
        <p id="mode-text" class="muted">…</p>
        <button class="btn danger wide" id="halt-btn">Kill switch</button>
      </div>
      <div class="sidebar-footer-row">
        <span class="tiny muted">Paper money only</span>
        <span class="tiny muted" id="updated">–</span>
      </div>
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumbs">
        <span class="crumb-brand">airp</span>
        <span class="crumb-slash">/</span>
        <strong id="crumb">Home</strong>
      </div>
      <div class="topbar-center">
        <div class="status-indicator" id="top-status">
          <span class="pulse-dot"></span>
          <span id="top-status-text">Paper engine ready</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="rebuild" title="Rebuild performance and analytics metrics">
          <span class="btn-icon">⚡</span>Rebuild charts
        </button>
        <button class="btn ghost" id="refresh" title="Reload data for current view">
          <span class="btn-icon">↻</span>Refresh
        </button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg">
    <h3 id="dlg-title"></h3>
    <p id="dlg-text" class="muted"></p>
    <input id="dlg-reason" placeholder="Reason" autocomplete="off">
    <input id="dlg-confirm" placeholder="Type HALT to confirm" autocomplete="off">
    <p id="dlg-error" class="err"></p>
    <div class="row-end">
      <button class="btn ghost" value="cancel">Cancel</button>
      <button class="btn danger" id="dlg-ok" value="ok">Confirm</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
