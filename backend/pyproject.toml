[project]
name = "airp-local-backend"
version = "0.1.0"
description = "AI Investment Research Platform (local-first edition) - backend"
requires-python = ">=3.11"
dependencies = [
  # Core web/config stack — everything below is actually imported by app/.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # Quant engine
  "numpy>=1.26",
  "scipy>=1.13",
  # LLM client transport
  "httpx>=0.27",
  # Data connector reliability
  "tenacity>=8.5",
  # Report rendering
  "jinja2>=3.1",
  # The scheduled paper-book runs (scripts/autorun.py and everything it starts): tables, Parquet price files,
  # free Yahoo prices. These were missing here although the live path cannot start without them
  # (tests/test_runtime_deps.py keeps this list honest; requirements.lock pins the versions in use).
  "pandas>=2.2",
  "pyarrow>=15",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
# Only needed if you enable the Neo4j-backed knowledge graph
# (app/knowledge_graph/neo4j_client.py) — off by default in this local-first
# edition. Kept out of the base install because the neo4j driver ships
# platform-specific compiled extensions that are unnecessary overhead (and
# an unnecessary source of install failures on some Windows/ARM setups) if
# you're not using the graph.
graph = [
  "neo4j>=5.23",
]
# Dashboards: `streamlit run app/dashboard/app.py` (walk-forward lab), `app/dashboard/portfolio.py` (paper portfolio)
ui = [
  "streamlit>=1.40",
]
# Research-only tests (scripts/skfolio_test.py); never imported by a scheduled run
research = [
  "skfolio>=0.5",
  "cvxpy>=1.5",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy-stubs>=1.14",
  "pandas-stubs>=2.2",
  "httpx2>=2.0",  # starlette's TestClient prefers this over httpx now
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` (and
# Query/Body/etc. the same way) — these calls are evaluated once per request
# by FastAPI's DI system, not once at import time like a normal mutable
# default argument, so B008's general warning doesn't apply to them. This is
# FastAPI's own documented pattern, not a bug to work around.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
