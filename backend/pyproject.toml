[project]
name = "airp-backend"
version = "0.1.0"
description = "AI Investment Research Platform - backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "neo4j>=5.23",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "networkx>=3.3",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.4",
  "python-dateutil>=2.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.111",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy-stubs>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
