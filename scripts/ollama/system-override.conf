# Optional: apply the same tuning to the system Ollama on :11434 instead (needs sudo):
#   sudo systemctl edit ollama      # paste the [Service] block below, save
#   sudo systemctl restart ollama
# Not required: the user service in airp-ollama-tuned.service gives the same speed on :11435.
[Service]
Environment=OLLAMA_FLASH_ATTENTION=1
Environment=OLLAMA_NUM_PARALLEL=4
Environment=OLLAMA_CONTEXT_LENGTH=16384
